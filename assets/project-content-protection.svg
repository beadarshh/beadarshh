<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-label="React Content Protection — Configurable React package that protects web content by blocking copying, right-clicks, printing, shortcuts and developer tools.">
<title>React Content Protection — Configurable React package that protects web content by blocking copying, right-clicks, printing, shortcuts and developer tools.</title>
<defs>
  <radialGradient id="glow" cx="0.05" cy="0.05" r=".75"><stop offset="0" stop-color="#3aaf4b" stop-opacity=".16"/><stop offset="1" stop-color="#3aaf4b" stop-opacity="0"/></radialGradient>
  <linearGradient id="runGrad" x1="0" x2="1"><stop offset="0" stop-color="#3aaf4b" stop-opacity="0"/><stop offset=".6" stop-color="#3aaf4b"/><stop offset="1" stop-color="#a7f3b5"/></linearGradient>
  <clipPath id="frame"><rect x="0" width="588" height="250" rx="22"/></clipPath>
</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e8efe9}
.mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0px);opacity:1}}
.runner{fill:none;stroke:url(#runGrad);stroke-width:2;stroke-linecap:round;stroke-dasharray:90 910;animation:run 8s linear infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
.mark{transform-box:fill-box;transform-origin:center;animation:mark 4s ease-in-out infinite}
@keyframes mark{0%,100%{transform:rotate(45deg)}50%{transform:rotate(225deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.dot{animation:dot 1.2s ease-in-out infinite}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.eyes{animation:eyes 4s ease-in-out infinite}
@keyframes eyes{0%,100%{transform:translateX(0px)}25%{transform:translateX(-1.6px)}50%{transform:translateX(1.6px)}75%{transform:translate(0px,1.2px)}}</style>
<g clip-path="url(#frame)">
  <rect x="0" width="588" height="250" fill="#0B0B0A"/>
  <rect x="0" width="588" height="250" fill="url(#glow)"/>
  
<rect x="28" y="28" width="52" height="52" rx="13" fill="#3aaf4b" fill-opacity=".1" stroke="#3aaf4b" stroke-opacity=".35"/>
<g transform="translate(54 54)" fill="none" stroke="#a7f3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -14 L12 -9 V0 C12 8 6 12 0 14 C-6 12 -12 8 -12 0 V-9 Z" fill="#a7f3b5" fill-opacity=".15"/><path d="M-5 0 L-1 4 L6 -4"/></g>
<text x="96" y="50" style="font-size:22px;font-weight:700">React Content Protection</text>
<text x="96" y="75" class="mono" style="font-size:13.5px;fill:#3aaf4b">React · npm package</text>
<text x="28" y="124" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>Configurable React package that protects web content by</tspan></text>
<text x="28" y="149" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>blocking copying, right-clicks, printing, shortcuts and</tspan></text>
<text x="28" y="174" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>developer tools.</tspan></text>
<path d="M28 198.5 H560" stroke="#1f2a22"/>
<text x="28" y="228" class="mono" style="font-size:13.5px;fill:#a7f3b5">$ npm i @beadarshh/react-content-protection</text>
<text x="560" y="228" text-anchor="end" class="mono" style="font-size:13.5px;fill:#8a9a8e">view repo →</text>
</g>
<rect x="0.75" y=".75" width="586.5" height="248.5" rx="21.25" fill="none" stroke="#1f2a22" stroke-width="1.5"/>
<rect class="runner" x="0.75" y=".75" width="586.5" height="248.5" rx="21.25" pathLength="1000" style="animation-delay:-0.5s"/>
</svg>
