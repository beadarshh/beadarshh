<rect class="mark" x="45" y="80" width="9" height="9" rx="2" fill="#FFFFFF"/>
<text x="65" y="91" class="mono" style="font-size:15px;fill:#8A8A8A">Who I am and what drives me</text>
<text x="43" y="150" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.1s" xml:space="preserve"><tspan>I'm a</tspan><tspan style="fill:#FAFAFA;font-weight:700"> Software Engineer</tspan><tspan> and</tspan><tspan style="fill:#FAFAFA;font-weight:700"> AI &amp; full-stack</tspan></text>
<text x="43" y="181" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.1s" xml:space="preserve"><tspan style="fill:#FAFAFA;font-weight:700">developer</tspan><tspan>, currently a</tspan><tspan style="fill:#FAFAFA;font-weight:700"> Software Developer at Drone</tspan></text>
<text x="43" y="212" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.1s" xml:space="preserve"><tspan style="fill:#FAFAFA;font-weight:700">Federation India</tspan><tspan> — building the digital infrastructure</tspan></text>
<text x="43" y="243" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.1s" xml:space="preserve"><tspan>behind India's drone ecosystem.</tspan></text>
<text x="43" y="290" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.25s" xml:space="preserve"><tspan>I work across the whole stack: designing APIs,</tspan></text>
<text x="43" y="321" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.25s" xml:space="preserve"><tspan>architecting systems, crafting interfaces and wiring AI</tspan></text>
<text x="43" y="352" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.25s" xml:space="preserve"><tspan>into products people actually use. I care about</tspan><tspan style="fill:#FAFAFA;font-weight:700"> clean</tspan></text>
<text x="43" y="383" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.25s" xml:space="preserve"><tspan style="fill:#FAFAFA;font-weight:700">architecture</tspan><tspan>,</tspan><tspan style="fill:#FAFAFA;font-weight:700"> fast, delightful UX</tspan><tspan>, and turning</tspan></text>
<text x="43" y="414" class="rise" style="font-size:19.5px;fill:#A3A3A3;animation-delay:0.25s" xml:space="preserve"><tspan>messy real-world problems into simple, elegant software.</tspan></text>
