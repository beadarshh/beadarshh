<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150" role="img" aria-label="Email: connect@beadarsh.in">
<title>Email: connect@beadarsh.in</title>
<defs>
  <radialGradient id="glow" cx="0.1" cy="0.1" r=".75"><stop offset="0" stop-color="#3aaf4b" stop-opacity=".16"/><stop offset="1" stop-color="#3aaf4b" stop-opacity="0"/></radialGradient>
  <linearGradient id="runGrad" x1="0" x2="1"><stop offset="0" stop-color="#3aaf4b" stop-opacity="0"/><stop offset=".6" stop-color="#3aaf4b"/><stop offset="1" stop-color="#a7f3b5"/></linearGradient>
  <clipPath id="frame"><rect x="6" width="282" height="150" rx="22"/></clipPath>
</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e8efe9}
.mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0px);opacity:1}}
.runner{fill:none;stroke:url(#runGrad);stroke-width:2;stroke-linecap:round;stroke-dasharray:90 910;animation:run 8s linear infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
.mark{transform-box:fill-box;transform-origin:center;animation:mark 4s ease-in-out infinite}
@keyframes mark{0%,100%{transform:rotate(45deg)}50%{transform:rotate(225deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.nudge{animation:nudge 2.4s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translate(0px,0px)}50%{transform:translate(3px,-3px)}}</style>
<g clip-path="url(#frame)">
  <rect x="6" width="282" height="150" fill="#0B0B0A"/>
  <rect x="6" width="282" height="150" fill="url(#glow)"/>
  
<rect x="31" y="27" width="46" height="46" rx="13" fill="#3aaf4b" fill-opacity=".1" stroke="#3aaf4b" stroke-opacity=".35"/>
<g transform="translate(54 50)" fill="none" stroke="#a7f3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-14" y="-10" width="28" height="20" rx="3"/><path d="M-13 -8 L0 2 L13 -8"/></g>
<g class="nudge" style="animation-delay:0.3s"><path d="M250 46 l10 -10 m-8 0 h8 v8" fill="none" stroke="#8a9a8e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="32" y="104" class="mono" style="font-size:12.5px;letter-spacing:2px;fill:#3aaf4b">EMAIL</text>
<text x="32" y="130" style="font-size:17.5px;font-weight:700">connect@beadarsh.in</text>
</g>
<rect x="6.75" y=".75" width="280.5" height="148.5" rx="21.25" fill="none" stroke="#1f2a22" stroke-width="1.5"/>
<rect class="runner" x="6.75" y=".75" width="280.5" height="148.5" rx="21.25" pathLength="1000" style="animation-delay:-1.0s"/>
</svg>
