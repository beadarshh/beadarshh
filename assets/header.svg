<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Adarsh Pandey — Software Engineer, AI &amp; Full-Stack Developer</title>
<desc id="desc">Software Fellow at Drone Federation India. Portfolio at beadarsh.in, email connect@beadarsh.in.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B0B0A"/><stop offset="1" stop-color="#0b1610"/>
  </linearGradient>
  <radialGradient id="auroraGreen"><stop offset="0" stop-color="#3aaf4b" stop-opacity=".32"/><stop offset="1" stop-color="#3aaf4b" stop-opacity="0"/></radialGradient>
  <radialGradient id="auroraTeal"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".18"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#e8efe9" fill-opacity=".06"/></pattern>
  <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#d7fbe0"/><stop offset="1" stop-color="#5fd36f"/>
  </linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-60" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 1000 0; 1000 0" keyTimes="0; .45; 1" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="edgeFade" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".18" stop-color="#fff"/><stop offset=".82" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <mask id="waveMask"><rect width="1200" height="440" fill="url(#edgeFade)"/></mask>
  <linearGradient id="pillStroke" x1="0" x2="1"><stop offset="0" stop-color="#3aaf4b"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
  <clipPath id="frame"><rect width="1200" height="440" rx="22"/></clipPath>
  <clipPath id="roleClip"><rect x="60" y="246" width="620" height="34"/></clipPath>
</defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,'Cascadia Code','SF Mono',Consolas,Menlo,monospace}
.drift1{animation:drift1 16s ease-in-out infinite alternate}
.drift2{animation:drift2 19s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(140px,50px)}}
@keyframes drift2{to{transform:translate(-160px,-40px)}}
.wave{animation:wave linear infinite}
@keyframes wave{to{transform:translateX(-300px)}}
.link{fill:none;stroke:#3aaf4b;stroke-opacity:.22;stroke-width:1}
.pulse{fill:none;stroke:#a7f3b5;stroke-width:2;stroke-linecap:round;stroke-dasharray:7 100;animation:pulse linear infinite}
@keyframes pulse{from{stroke-dashoffset:107}to{stroke-dashoffset:0}}
.node{fill:#a7f3b5}
.halo{fill:none;stroke:#3aaf4b;transform-box:fill-box;transform-origin:center;animation:halo 3.2s ease-out infinite}
@keyframes halo{0%{transform:scale(1);opacity:.8}100%{transform:scale(4);opacity:0}}
.caret{animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.role{opacity:0;animation:role 12s cubic-bezier(.2,.8,.2,1) infinite both}
@keyframes role{0%{transform:translateY(26px);opacity:0}5%,22%{transform:translateY(0);opacity:1}27%,100%{transform:translateY(-26px);opacity:0}}
.ember{fill:#7ee08a;animation:ember linear infinite}
@keyframes ember{0%{transform:translateY(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-230px);opacity:0}}
.orbit{fill:none;stroke:url(#pillStroke);stroke-width:1.5;stroke-dasharray:24 400;animation:orbit 4s linear infinite}
@keyframes orbit{to{stroke-dashoffset:-424}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g clip-path="url(#frame)">
  <rect width="1200" height="440" fill="url(#bg)"/>
  <rect width="1200" height="440" fill="url(#dots)"/>
  <ellipse class="drift1" cx="230" cy="110" rx="460" ry="280" fill="url(#auroraGreen)"/>
  <ellipse class="drift2" cx="960" cy="320" rx="420" ry="260" fill="url(#auroraTeal)"/>

  <!-- constellation network -->
  <g>
    <path class="link" d="M760 70 L850 120 L960 82 L1060 132 L1140 78 M850 120 L880 210 L990 190 L1060 132 M880 210 L800 262 L760 170 L850 120 M990 190 L1100 240 L1140 160 L1060 132 M800 262 L930 300 L990 190 M930 300 L1060 320 L1100 240 M760 170 L700 110 L760 70"/>
    <path class="pulse" pathLength="100" d="M760 70 L850 120 L960 82 L1060 132 L1140 78" style="animation-duration:5.5s"/>
    <path class="pulse" pathLength="100" d="M800 262 L930 300 L1060 320 L1100 240 L1140 160" style="animation-duration:6.5s;animation-delay:-2s"/>
    <path class="pulse" pathLength="100" d="M700 110 L760 170 L850 120 L880 210 L990 190 L1060 132" style="animation-duration:7s;animation-delay:-4s"/>
    <g>
      <circle class="halo" cx="850" cy="120" r="3"/>
      <circle class="halo" cx="990" cy="190" r="3" style="animation-delay:-1.1s"/>
      <circle class="halo" cx="1100" cy="240" r="3" style="animation-delay:-2.2s"/>
      <circle class="halo" cx="760" cy="70" r="3" style="animation-delay:-.6s"/>
      <circle class="node" cx="760" cy="70" r="2.6"/><circle class="node" cx="850" cy="120" r="3.4"/>
      <circle class="node" cx="960" cy="82" r="2.4"/><circle class="node" cx="1060" cy="132" r="3"/>
      <circle class="node" cx="1140" cy="78" r="2.2"/><circle class="node" cx="880" cy="210" r="2.4"/>
      <circle class="node" cx="990" cy="190" r="3.4"/><circle class="node" cx="800" cy="262" r="2.6"/>
      <circle class="node" cx="760" cy="170" r="2.2"/><circle class="node" cx="1100" cy="240" r="3"/>
      <circle class="node" cx="1140" cy="160" r="2.2"/><circle class="node" cx="930" cy="300" r="2.6"/>
      <circle class="node" cx="1060" cy="320" r="2.2"/><circle class="node" cx="700" cy="110" r="2.2"/>
    </g>
  </g>

  <!-- embers -->
  <g>
    <circle class="ember" cx="90" cy="430" r="1.4" style="animation-duration:9s"/>
    <circle class="ember" cx="260" cy="440" r="1" style="animation-duration:11s;animation-delay:-3s"/>
    <circle class="ember" cx="410" cy="430" r="1.6" style="animation-duration:8s;animation-delay:-6s"/>
    <circle class="ember" cx="560" cy="440" r="1.1" style="animation-duration:12s;animation-delay:-1s"/>
    <circle class="ember" cx="690" cy="430" r="1.3" style="animation-duration:10s;animation-delay:-7s"/>
    <circle class="ember" cx="840" cy="440" r="1" style="animation-duration:9.5s;animation-delay:-4s"/>
    <circle class="ember" cx="1010" cy="430" r="1.5" style="animation-duration:11.5s;animation-delay:-8s"/>
    <circle class="ember" cx="1150" cy="440" r="1.1" style="animation-duration:8.5s;animation-delay:-2s"/>
  </g>

  <!-- flowing lines -->
  <g mask="url(#waveMask)" fill="none" stroke-linecap="round">
    <path class="wave" style="animation-duration:9s" stroke="#3aaf4b" stroke-opacity=".55" stroke-width="1.6" d="M0 400 Q75 380 150 400 T300 400 T450 400 T600 400 T750 400 T900 400 T1050 400 T1200 400 T1350 400 T1500 400"/>
    <path class="wave" style="animation-duration:13s" stroke="#2dd4bf" stroke-opacity=".35" stroke-width="1.2" d="M0 410 Q75 426 150 410 T300 410 T450 410 T600 410 T750 410 T900 410 T1050 410 T1200 410 T1350 410 T1500 410"/>
    <path class="wave" style="animation-duration:18s" stroke="#a7f3b5" stroke-opacity=".22" stroke-width="1" d="M0 392 Q75 366 150 392 T300 392 T450 392 T600 392 T750 392 T900 392 T1050 392 T1200 392 T1350 392 T1500 392"/>
  </g>

  <!-- copy -->
  <g class="rise">
    <text x="72" y="110" class="mono" font-size="17" fill="#3aaf4b" textLength="196" lengthAdjust="spacing">~/beadarsh $ whoami</text>
    <rect class="caret" x="274" y="96" width="9" height="18" fill="#3aaf4b"/>
  </g>
  <g class="rise" style="animation-delay:.15s">
    <text x="70" y="182" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#nameFill)">Adarsh Pandey</text>
    <text x="70" y="182" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#shine)" opacity=".55">Adarsh Pandey</text>
  </g>
  <g class="rise" style="animation-delay:.3s">
    <text x="72" y="228" font-size="22" font-weight="600" fill="#e8efe9">Software Engineer · AI &amp; Full-Stack Developer</text>
  </g>
  <g clip-path="url(#roleClip)">
    <text x="72" y="270" class="mono" font-size="17" fill="#3aaf4b">▹</text>
    <g font-size="18" fill="#a7b8ab">
      <text class="role" x="96" y="270">crafting <tspan fill="#a7f3b5">AI-powered products</tspan> with LLMs &amp; RAG</text>
      <text class="role" x="96" y="270" style="animation-delay:3s">building <tspan fill="#a7f3b5">scalable web platforms</tspan> &amp; robust APIs</text>
      <text class="role" x="96" y="270" style="animation-delay:6s">engineering <tspan fill="#a7f3b5">India's drone-tech</tspan> digital infrastructure</text>
      <text class="role" x="96" y="270" style="animation-delay:9s">shipping <tspan fill="#a7f3b5">open-source tools</tspan> &amp; Chrome extensions</text>
    </g>
  </g>
  <g class="rise" style="animation-delay:.45s">
    <text x="72" y="312" font-size="15" fill="#8a9a8e">Software Developer @ <tspan fill="#cfe9d4" font-weight="600">Drone Federation India</tspan>  ·  Delhi, India</text>
  </g>

  <!-- website + email pills -->
  <g class="rise" style="animation-delay:.6s">
    <rect x="70" y="334" width="190" height="42" rx="21" fill="#3aaf4b" fill-opacity=".1" stroke="#3aaf4b" stroke-opacity=".35"/>
    <rect class="orbit" x="70" y="334" width="190" height="42" rx="21" pathLength="424"/>
    <g fill="none" stroke="#a7f3b5" stroke-width="1.5" transform="translate(98 355)">
      <circle r="8"/><ellipse rx="3.6" ry="8"/><path d="M-8 0 H8 M-6.6 -4.4 H6.6 M-6.6 4.4 H6.6" stroke-width="1.1"/>
    </g>
    <text x="116" y="361" font-size="17" font-weight="700" fill="#ffffff" textLength="98" lengthAdjust="spacingAndGlyphs">beadarsh.in</text>
    <path d="M230 360 l8 -8 m-6 0 h6 v6" fill="none" stroke="#a7f3b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="276" y="334" width="250" height="42" rx="21" fill="#e8efe9" fill-opacity=".04" stroke="#e8efe9" stroke-opacity=".14"/>
    <g fill="none" stroke="#a7b8ab" stroke-width="1.5" stroke-linejoin="round" transform="translate(304 355)">
      <rect x="-9" y="-6.5" width="18" height="13" rx="2.5"/><path d="M-8 -5 L0 1.5 L8 -5"/>
    </g>
    <text x="322" y="360.5" class="mono" font-size="15" fill="#cfe9d4" textLength="180" lengthAdjust="spacingAndGlyphs">connect@beadarsh.in</text>
  </g>
</g>
<rect x=".75" y=".75" width="1198.5" height="438.5" rx="21.5" fill="none" stroke="#1f2a22" stroke-width="1.5"/>
</svg>
