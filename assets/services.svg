  <text x="446" y="222" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>Clean, documented APIs that let</tspan></text>
<text x="446" y="245" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>systems talk to each other</tspan></text>
<text x="446" y="268" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>seamlessly.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.26s">
  <rect x="801" y="118" width="356" height="162" rx="16" fill="#111512" stroke="#1f2a22"/>
  <g class="glowbox" style="animation-delay:1.4s">
<rect x="825" y="142" width="48" height="48" rx="13" fill="#3aaf4b" fill-opacity=".1" stroke="#3aaf4b" stroke-opacity=".35"/>
<g transform="translate(849 166)" fill="none" stroke="#a7f3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -13 C1.5 -4 4 -1.5 13 0 C4 1.5 1.5 4 0 13 C-1.5 4 -4 1.5 -13 0 C-4 -1.5 -1.5 -4 0 -13Z" fill="#a7f3b5" fill-opacity=".2"/><circle cx="10" cy="-10" r="2" fill="#a7f3b5"/></g></g>
  <text x="889" y="173" style="font-size:20px;font-weight:700">AI Integration</text>
  <text x="825" y="222" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>LLMs, RAG, computer vision and ML —</tspan></text>
<text x="825" y="245" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>shipped inside real products.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.34s">
  <rect x="43" y="303" width="356" height="162" rx="16" fill="#111512" stroke="#1f2a22"/>
  <g class="glowbox" style="animation-delay:2.1s">
<rect x="67" y="327" width="48" height="48" rx="13" fill="#3aaf4b" fill-opacity=".1" stroke="#3aaf4b" stroke-opacity=".35"/>
<g transform="translate(91 351)" fill="none" stroke="#a7f3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -12 L13 -5 L0 2 L-13 -5Z" fill="#a7f3b5" fill-opacity=".2"/><path d="M-13 1 L0 8 L13 1 M-13 6 L0 13 L13 6"/></g></g>
  <text x="131" y="358" style="font-size:20px;font-weight:700">UI/UX Design</text>
  <text x="67" y="407" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>Intuitive, motion-rich interfaces</tspan></text>
<text x="67" y="430" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>designed in Figma, built for people.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.42s">
  <rect x="422" y="303" width="356" height="162" rx="16" fill="#111512" stroke="#1f2a22"/>
  <g class="glowbox" style="animation-delay:2.8s">
<rect x="446" y="327" width="48" height="48" rx="13" fill="#3aaf4b" fill-opacity=".1" stroke="#3aaf4b" stroke-opacity=".35"/>
<g transform="translate(470 351)" fill="none" stroke="#a7f3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 -13 L-8 2 H0 L-3 13 L8 -2 H0 Z" fill="#a7f3b5" fill-opacity=".2"/></g></g>
  <text x="510" y="358" style="font-size:20px;font-weight:700">Workflow Automation</text>
  <text x="446" y="407" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>Scripts, bots and pipelines that</tspan></text>
<text x="446" y="430" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>remove repetitive work.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.50s">
  <rect x="801" y="303" width="356" height="162" rx="16" fill="#111512" stroke="#1f2a22"/>
  <g class="glowbox" style="animation-delay:3.5s">
<rect x="825" y="327" width="48" height="48" rx="13" fill="#3aaf4b" fill-opacity=".1" stroke="#3aaf4b" stroke-opacity=".35"/>
<g transform="translate(849 351)" fill="none" stroke="#a7f3b5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-5" r="5"/><path d="M-14 11 C-14 4 4 4 4 11"/><circle cx="8" cy="-3" r="3.6"/><path d="M6 5 C11 4 15 6 15 11"/></g></g>
