  <text x="825" y="407" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>Leading teams, reviewing architecture</tspan></text>
<text x="825" y="430" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>and mentoring developers.</tspan></text>
