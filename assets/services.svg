  <text x="131" y="173" style="font-size:20px;font-weight:700">Scalable Web Apps</text>
  <text x="67" y="222" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>Modern full-stack products, from</tspan></text>
<text x="67" y="245" class="" style="font-size:16.5px;fill:#a9b8ad" xml:space="preserve"><tspan>database schema to pixel-perfect UI.</tspan></text>
</g>
<g class="rise" style="animation-delay:0.18s">
  <rect x="422" y="118" width="356" height="162" rx="16" fill="#111512" stroke="#1f2a22"/>
  <g class="glowbox" style="animation-delay:0.7s">
<rect x="446" y="142" width="48" height="48" rx="13" fill="#3aaf4b" fill-opacity=".1" stroke="#3aaf4b" stroke-opacity=".35"/>
