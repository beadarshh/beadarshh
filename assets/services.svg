<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="505" viewBox="0 0 1200 505" role="img" aria-label="What I do — scalable web apps, robust APIs, AI integration, UI/UX design, workflow automation, technical leadership">
<title>What I do — scalable web apps, robust APIs, AI integration, UI/UX design, workflow automation, technical leadership</title>
<defs>
  <radialGradient id="glow" cx="0.1" cy="0.9" r=".75"><stop offset="0" stop-color="#3aaf4b" stop-opacity=".16"/><stop offset="1" stop-color="#3aaf4b" stop-opacity="0"/></radialGradient>
  <linearGradient id="runGrad" x1="0" x2="1"><stop offset="0" stop-color="#3aaf4b" stop-opacity="0"/><stop offset=".6" stop-color="#3aaf4b"/><stop offset="1" stop-color="#a7f3b5"/></linearGradient>
  <clipPath id="frame"><rect x="0" width="1200" height="505" rx="22"/></clipPath>
</defs>
<style>
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#e8efe9}
.mono{font-family:ui-monospace, SFMono-Regular, 'Cascadia Code', 'SF Mono', Consolas, Menlo, monospace}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:translateY(0px);opacity:1}}
.runner{fill:none;stroke:url(#runGrad);stroke-width:2;stroke-linecap:round;stroke-dasharray:90 910;animation:run 8s linear infinite}
@keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1000}}
.mark{transform-box:fill-box;transform-origin:center;animation:mark 4s ease-in-out infinite}
@keyframes mark{0%,100%{transform:rotate(45deg)}50%{transform:rotate(225deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.dot{animation:dot 1.2s ease-in-out infinite}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.eyes{animation:eyes 4s ease-in-out infinite}
@keyframes eyes{0%,100%{transform:translateX(0px)}25%{transform:translateX(-1.6px)}50%{transform:translateX(1.6px)}75%{transform:translate(0px,1.2px)}}
.glowbox{animation:glowbox 4.2s ease-in-out infinite}
@keyframes glowbox{0%,100%{opacity:1}50%{opacity:.55}}
.sheen{animation:sheen 6s ease-in-out infinite}
@keyframes sheen{0%{transform:translateX(0px) skewX(-20deg)}55%,100%{transform:translateX(1400px) skewX(-20deg)}}</style>
<g clip-path="url(#frame)">
  <rect x="0" width="1200" height="505" fill="#0B0B0A"/>
  <rect x="0" width="1200" height="505" fill="url(#glow)"/>
  <defs><clipPath id="tiles"><rect x="43" y="118" width="356" height="162" rx="16"/><rect x="422" y="118" width="356" height="162" rx="16"/><rect x="801" y="118" width="356" height="162" rx="16"/><rect x="43" y="303" width="356" height="162" rx="16"/><rect x="422" y="303" width="356" height="162" rx="16"/><rect x="801" y="303" width="356" height="162" rx="16"/></clipPath><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>

<text x="43" y="61" style="font-size:25px;font-weight:700">What I Do</text>
<rect class="mark" x="45" y="80" width="9" height="9" rx="2" fill="#3aaf4b"/>
<text x="65" y="91" class="mono" style="font-size:15px;fill:#8a9a8e">// the work I love shipping</text>
