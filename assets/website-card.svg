    <rect x="612" y="88" width="172" height="170" rx="14" fill="#111512" stroke="#1f2a22"/>
    <rect x="622" y="98" width="152" height="96" rx="9" fill="url(#thumbA)"/>
    <g fill="none" stroke="#a7f3b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="664" y="118" width="30" height="20" rx="4"/><rect x="702" y="154" width="30" height="20" rx="4"/><path d="M679 138 v26 h23"/><path d="M697 160 l5 4 -5 4"/>
    </g>
    <text x="628" y="222" font-size="15" font-weight="700" fill="#ffffff">DiagramGen</text>
