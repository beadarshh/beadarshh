    <path d="M884 304 l20 8 v14 c0 14 -10 22 -20 26 c-10 -4 -20 -12 -20 -26 v-14 z" fill="#3aaf4b" fill-opacity=".15" stroke="#a7f3b5" stroke-width="2" stroke-linejoin="round"/>
    <path d="M876 329 l6 6 l11 -12" fill="none" stroke="#a7f3b5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
