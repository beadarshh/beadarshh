    <rect x="994" y="282" width="152" height="96" rx="9" fill="url(#thumbB)"/>
    <polyline points="1012,344 1028,338 1040,344 1054,336 1066,304 1076,352 1090,340 1104,344 1128,330" fill="none" stroke="#99f6e4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="spike" cx="1066" cy="304" r="4" fill="#ff5f57"/><circle cx="1066" cy="304" r="4" fill="#ff5f57"/>
    <text x="1000" y="406" font-size="15" font-weight="700" fill="#ffffff">Flight Anomaly AI</text>
    <text x="1000" y="427" font-size="12" fill="#8a9a8e">Drone telemetry ML</text>
