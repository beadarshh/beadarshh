    <rect x="808" y="98" width="152" height="96" rx="9" fill="url(#thumbB)"/>
    <g fill="none" stroke="#99f6e4" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
      <rect x="860" y="130" width="48" height="32" rx="4"/><path d="M862 133 L884 150 L906 133"/>
    </g>
    <circle cx="907" cy="131" r="5" fill="#3aaf4b"><animate attributeName="r" values="5;7;5" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="814" y="222" font-size="15" font-weight="700" fill="#ffffff">EasyMail</text>
    <text x="814" y="243" font-size="12" fill="#8a9a8e">Self-hosted email platform</text>
  </g>
  <g class="show" style="animation-delay:.51s">
    <rect x="984" y="88" width="172" height="170" rx="14" fill="#111512" stroke="#1f2a22"/>
    <rect x="994" y="98" width="152" height="96" rx="9" fill="url(#thumbA)"/>
    <path d="M1046 128 h36 a10 10 0 0 1 10 10 v10 a10 10 0 0 1 -10 10 h-24 l-10 8 v-8 h-2 a10 10 0 0 1 -10 -10 v-10 a10 10 0 0 1 10 -10 z" fill="none" stroke="#a7f3b5" stroke-width="2" stroke-linejoin="round"/>
    <circle class="dot" cx="1056" cy="143" r="3" fill="#a7f3b5"/><circle class="dot" cx="1068" cy="143" r="3" fill="#a7f3b5" style="animation-delay:.2s"/><circle class="dot" cx="1080" cy="143" r="3" fill="#a7f3b5" style="animation-delay:.4s"/>
    <text x="1000" y="222" font-size="15" font-weight="700" fill="#ffffff">Alex AI</text>
    <text x="1000" y="243" font-size="12" fill="#8a9a8e">Interview feedback bot</text>
  </g>
  <g class="show" style="animation-delay:.59s">
    <rect x="612" y="272" width="172" height="170" rx="14" fill="#111512" stroke="#1f2a22"/>
    <rect x="622" y="282" width="152" height="96" rx="9" fill="url(#thumbB)"/>
    <ellipse cx="698" cy="330" rx="34" ry="14" fill="none" stroke="#99f6e4" stroke-opacity=".5" stroke-width="1.5" transform="rotate(-18 698 330)"/>
    <circle cx="698" cy="330" r="7" fill="#99f6e4"/>
    <g transform="rotate(-18 698 330)"><circle r="4" fill="#3aaf4b"><animateMotion dur="5s" repeatCount="indefinite" path="M732 330 A34 14 0 1 1 664 330 A34 14 0 1 1 732 330"/></circle></g>
    <text x="628" y="406" font-size="15" font-weight="700" fill="#ffffff">Orbit</text>
    <text x="628" y="427" font-size="12" fill="#8a9a8e">Team task OS</text>
  </g>
  <g class="show" style="animation-delay:.67s">
    <rect x="798" y="272" width="172" height="170" rx="14" fill="#111512" stroke="#1f2a22"/>
