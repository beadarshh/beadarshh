name: Profile graphics

# Rebuilds the particle contribution graph + stats card and publishes them to the `output` branch,
# which the README reads from via raw.githubusercontent.com.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-profile-graphics.mjs
      - .github/workflows/profile-graphics.yml

permissions:
  contents: write

concurrency:
  group: profile-graphics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build animated SVGs
        run: node scripts/generate-profile-graphics.mjs "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to the output branch
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update profile graphics"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" output
